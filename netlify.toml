[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# API first: send /api/* to the Express serverless function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# React Router fallback for all other routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
